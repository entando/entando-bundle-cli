# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
services:
  postgresql:
    image: entando/entando-postgres-rocky:%POSTGRES_DOCKER_IMAGE%
    # the image is published for amd64 only: on ARM hosts (e.g. Apple Silicon) Docker runs it emulated
    platform: linux/amd64
    restart: always
    # Without a volume, the data is lost whenever the container is recreated (e.g. on an image upgrade).
    # If you want to persist the postgres data, uncomment the lines below.
    # Mount /var/lib/pgsql (owned by the postgres user in the image): mounting the PGDATA folder
    # (/var/lib/pgsql/data/userdata) directly makes the container fail on first boot.
    # A persisted data folder cannot be opened by a newer PostgreSQL major version: use pg_dump/restore to upgrade.
    # volumes:
    #   - ~/volumes/entando-bundle-cli/%BUNDLENAME%/postgresql/:/var/lib/pgsql/
    environment:
      - POSTGRESQL_USER=%BUNDLENAME%-user
      - POSTGRESQL_PASSWORD=%BUNDLENAME%-password
      - POSTGRESQL_DATABASE=%BUNDLENAME%
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:5432:5432
